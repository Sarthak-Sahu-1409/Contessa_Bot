name: contest-alert

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}  

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run notifier
        env:
          CLIST_USER: ${{ secrets.CLIST_USER }}
          CLIST_KEY: ${{ secrets.CLIST_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python scripts/check_and_notify.py
